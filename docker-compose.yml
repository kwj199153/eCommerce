# ============================================================
#  店管家 AI（跨境电商 AI SaaS）— 一键部署
# ------------------------------------------------------------
#  用法（在项目根目录执行）：
#
#    # 1. 准备后端环境变量（首次）
#    cp backend/.env.example backend/.env
#    #    然后编辑 backend/.env，至少填：
#    #      DASHSCOPE_API_KEY=<你的>
#    #      JWT_SECRET_KEY=<随机高熵字符串>
#    #      ENVIRONMENT=production     ← 生产必须
#    #      AUTH_REQUIRED=true         ← 生产必须（默认已是 true）
#    #      PAYMENT_GATEWAY=...        ← 生产不能是 mock，否则拒绝启动
#
#    # 2. 起全套
#    docker compose up -d --build
#
#    # 3. 看状态 / 日志
#    docker compose ps
#    docker compose logs -f backend
#
#    # 4. 首次初始化（已建表则跳过；回填店铺归属是必须的）
#    docker compose exec backend python scripts/backfill_owner_id.py
#
#    # 5. 停止（保留数据卷）/ 连数据一起删
#    docker compose down
#    docker compose down -v
#
#  访问：
#    前端  http://localhost:8080
#    接口  http://localhost:8080/api/v1      （经 nginx 转发，同源无跨域）
#    指标  http://localhost:8000/metrics     （API 进程；设了 METRICS_TOKEN 需带 Bearer）
#    Worker 指标/健康  http://localhost:9100/metrics  ·  /health
#           ★ 单看 8000/metrics 是不够的：任务类指标（aigc_tasks_total /
#             celery_task_results_total）只在 **worker 进程**里自增，必须查这个端口。
#    健康  http://localhost:8000/health?detail=true
#
#  ⚠️ 首次使用前注意（本地已有 my-postgres 在跑的情况）：
#    本文件给 postgres 写死了 container_name: my-postgres（保持与既有习惯一致）。
#    若该容器是**用 docker run 手工起的**（不是本 compose 起的），compose 会报
#    "container name is already in use"。两种处理方式：
#      a) 先接管：docker rm -f my-postgres   然后 docker compose up -d
#         —— 数据在 pgdata 卷里，容器删掉不会丢数据；
#      b) 或者只起需要的服务：docker compose up -d --build backend worker frontend
#         —— 复用你已经在跑的 PG。
#
#  ⚠️ 生产上线前必读：
#    1. **必须挂 HTTPS**。语音录音走浏览器 getUserMedia，HTTP 下浏览器直接拒绝；
#       且 Token 走明文传输等于没有鉴权。在生产反代（本文件的 nginx 或外层 SLB）
#       上配 TLS，并把 PUBLIC_BASE_URL 设为 https:// 开头的域名。
#    2. **PAYMENT_GATEWAY 不能是 mock**。MockGateway 无条件返回支付成功，
#       用户点一下「升级专业版」就白拿付费套餐。生产用 mock 会**拒绝启动**。
#    3. /metrics 对外暴露前设 METRICS_TOKEN，否则 QPS/错误率/接口清单公开可读。
#    4. 首次部署后跑 backfill_owner_id.py，否则存量店铺 owner_id 为空，
#       生产模式下非 admin 访问业务数据一律 403。
#    5. **数据库口令与端口不许用默认值**。本文件的口令走
#       ${POSTGRES_PASSWORD:-123456} 插值，默认值只为本地一键起保留；
#       生产请在**本目录**的 .env 里设 POSTGRES_PASSWORD（注意：compose 的
#       变量插值只读本目录 .env，**不读 backend/.env**），并同步
#       backend/worker/beat 的 DATABASE_URL；两处不一致会连不上库。
#       5432 已改为只绑 127.0.0.1 —— 需要外部连库请走 SSH 隧道，
#       不要改回 0.0.0.0。生产模式若仍用默认口令，后端会**拒绝启动**。
#    6. **镜像名走 ${API_IMAGE:-...} / ${WEB_IMAGE:-...} 插值**（下方 4 个服务的
#       image: 字段）。默认值就是原来的本地镜像名 ⇒ **不设变量时行为与改前完全一致**，
#       本地 `docker compose up -d --build` 照旧。CD 部署时在**本目录**的 .env 里写：
#           API_IMAGE=ghcr.io/<owner>/<repo>/storekeeper-api:v1.0.0
#           WEB_IMAGE=ghcr.io/<owner>/<repo>/storekeeper-web:v1.0.0
#       让 `docker compose pull` 去拉 GHCR 的镜像（详见 .github/workflows/cd.yml 与
#       scripts/deploy/remote_deploy.sh）。**注意**：compose 的变量插值只读本目录 .env，
#       **不读 backend/.env** —— 与第 5 条同一个坑。
# ============================================================

services:
  # ========== 1. PostgreSQL（业务数据 + 店铺归属，必需）==========
  postgres:
    image: postgres:15-alpine
    container_name: my-postgres
    restart: unless-stopped
    environment:
      # ★ 口令不许写死在文件里（会被提交进 git、会被安全审计判为明文凭据）。
      #   默认值只为「本地一键起」保留：不设任何环境变量时，行为与改前完全一致。
      #   生产必须覆盖 POSTGRES_PASSWORD，且**同步改 backend/worker/beat 的
      #   DATABASE_URL** —— 两处口令不一致时容器连不上库（改一处必踩）。
      POSTGRES_USER: ${POSTGRES_USER:-kevin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-123456}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    ports:
      # ★ 只绑回环：`"5432:5432"` 等价于监听 0.0.0.0，即把库连同弱口令
      #   一起挂到公网（扫描器几小时内就能撞上）。绑 127.0.0.1 后，
      #   本机工具仍直连 localhost:5432，行为不变；外部连库请走 SSH 隧道。
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # ★ 第 351 轮 / P0-2（PITR）：WAL 归档段的落点。
      #   为什么必须是一个**卷**而不是容器内的普通目录：
      #     `archive_command` 把每个写满的 16MB 段 `cp` 到这个目录，而它默认会落在
      #     容器的**可写层** —— `docker stop/start` 还在，**`docker rm -f` 全丢**。
      #     PITR 的恢复粒度完全依赖这些段，所以它们必须住在卷里。
      #   ★ 与 `pgdata` 分开是刻意的：归档段是**只增**的，放在数据目录里会让
      #     每次 `pg_basebackup` 把整份归档一起打包（基线体积随归档无限膨胀）。
      #   ★ 路径必须与 `backend/scripts/pg_pitr.py::ARCHIVE_IN_CONTAINER` 一致 ——
      #     `tests/test_pitr.py` 会把两边钉住。
      - walarchive:/var/lib/postgresql/wal-archive
    healthcheck:
      # 用户名/库名与上面的 POSTGRES_* 同源：改了一处而漏改这里，
      # 健康检查会永久 unhealthy，容器起不来但报错指向健康检查（难查）。
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kevin} -d ${POSTGRES_DB:-postgres}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [storekeeper]

  # ========== 2. Redis（Celery broker + 限流 + 缓存）==========
  #  ★ 为什么必须要它（而不只是 PG）：
  #    - Celery 的 broker 与 result backend 都需要它（P1-5 异步任务的依赖）
  #    - 限流中间件优先用 Redis 做跨进程计数；缺了会**降级为进程内计数** ——
  #      单副本还能用，多副本时每个副本各算一份，实际限额被放大 N 倍
  #    - 缺 Redis 时服务**仍能启动**（fail-open 设计），所以漏配不会报错，
  #      只会让限流悄悄失效、异步任务全部报错 —— 这正是要写进 compose 的理由
  redis:
    image: redis:7-alpine
    container_name: my-redis
    restart: unless-stopped
    # appendonly：开 AOF 持久化。限流计数与缓存在重启后清零会造成瞬时放量。
    # maxmemory-policy allkeys-lru：满了淘汰最久未用的 key，而不是写入报错。
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - 512mb
      - --maxmemory-policy
      - allkeys-lru
    ports:
      # 只绑回环：Redis 无鉴权，绝不能对公网开放
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [storekeeper]

  # ========== 3. 后端 API ==========
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: "${API_IMAGE:-storekeeper-api:latest}"
    container_name: storekeeper-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ./backend/.env
    environment:
      # ★ 容器内连 PG/Redis 必须用**服务名**，不是 localhost。
      #   写 localhost 会连到容器自己的回环，表现为「compose 明明起来了却连不上库」。
      #   这里显式覆盖 .env 里的本地地址，让本地与容器两种环境共用同一份 .env。
      # ★ 与 postgres 服务的口令同源：生产改 POSTGRES_PASSWORD 时必须同步改这里。
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://kevin:123456@postgres:5432/postgres}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      # 容器里日志由 Docker 负责收集/轮转 → 出 JSON 便于采集
      LOG_JSON: "true"
    ports:
      # 只开回环：公网一律经前端 nginx（同源 + 反代），不把后端裸暴露成可跨域目标
      - "127.0.0.1:8000:8000"
    volumes:
      # AIGC 素材产物落盘（重建容器不丢），后端经 /static 对外暴露
      - uploads:/app/uploads
      - logs:/app/logs
    networks: [storekeeper]

# ========== 4. Celery Worker（异步任务）==========
# 与 backend 共用镜像：任务代码就是业务代码，不必单独打包。
# worker.py 里已声明队列 default,ai_tasks,data_export；默认池是 threads（见该文件
# 顶部说明：任务的指标注册表是进程内的，prefork 下子进程的计数不会出现在 /metrics 里）。
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: "${API_IMAGE:-storekeeper-api:latest}"
    container_name: storekeeper-worker
    restart: unless-stopped
    # 覆盖 CMD：同一镜像跑 worker 而不是 uvicorn
    command: ["python", "worker.py"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ./backend/.env
    environment:
      # ★ 与 postgres 服务的口令同源：生产改 POSTGRES_PASSWORD 时必须同步改这里。
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://kevin:123456@postgres:5432/postgres}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      LOG_JSON: "true"
      # 指标/健康端口（worker.py 里默认就是 9100，这里显式写出便于运维一眼看到）
      WORKER_METRICS_PORT: "9100"
    ports:
      # 只绑回环：这个端口没有任何鉴权（/metrics 会暴露任务量与错误率）
      - "127.0.0.1:9100:9100"
    healthcheck:
      # ★ 为什么必须用 /health 而不是 "进程还在"：worker 卡在「已启动但未 ready」
      #   时进程是活的，容器状态也是 Up，而队列里的任务会一直排队。
      #   worker.py 的 /health 在未 ready 时返回 503 ⇒ 这里的 healthcheck 真的能判不可用。
      # 用 python 而不是 curl：镜像里没有 curl（少装一个包 = 少一处 CVE）。
      test:
        - CMD-SHELL
        - >-
          python -c "import urllib.request as u; u.urlopen('http://127.0.0.1:9100/health', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    volumes:
      - uploads:/app/uploads
      - logs:/app/logs
    networks: [storekeeper]

  # ========== 4b. Celery Beat（定时任务：长期记忆每晚自动整理）==========
  # ★ 为什么不给 worker 加 `-B`（内嵌调度器）：Celery 官方文档明确说 -B 只适合开发；
  #   本项目还有一条更具体的理由 —— 调度器需要**独占**一个 schedule 文件
  #   （记录 last_run_at），与任务执行共进程时会互抢，报 PermissionError 或
  #   **静默不触发**（现象是"整晚没跑"，最难排查）。见 backend/beat.py 顶部论证。
  # ★ 单副本：调度器**不能**水平扩容 —— 两个 beat 会各触发一次，
  #   同一晚的整理被投递两遍。冷却窗口是第二道保险，但这里从一开始就只跑一个实例。
  beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: "${API_IMAGE:-storekeeper-api:latest}"
    container_name: storekeeper-beat
    restart: unless-stopped
    command: ["python", "beat.py"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ./backend/.env
    environment:
      # ★ 与 postgres 服务的口令同源：生产改 POSTGRES_PASSWORD 时必须同步改这里。
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://kevin:123456@postgres:5432/postgres}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      LOG_JSON: "true"
    volumes:
      # schedule 文件落在 logs/ 下（beat.py 的选择）⇒ 必须持久化；
      # 与 worker 共用同一个卷，避免两个容器各持一份互相覆盖。
      - logs:/app/logs
    networks: [storekeeper]

  # ========== 5. 前端（nginx 托管 dist + 反代 /api、/static）==========
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # ★ Vite 变量是**构建期**注入（编译进 bundle），不是运行期读取。
        #   改这里的值必须 `docker compose up -d --build` 重建，重启容器无效。
        VITE_DEMO_MODE: "false"
        VITE_VOICE_CLONE_ENABLED: "false"
    image: "${WEB_IMAGE:-storekeeper-web:latest}"
    container_name: storekeeper-web
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"
    networks: [storekeeper]

  # ========== 6. 监控（可选，需 `--profile monitoring` 才启动）==========
  # ★ 为什么默认不起：不是每个部署都需要自带 Prometheus（云监控 / APM 也可），
  #   而默认多拉两个镜像会让「一键起」变慢、变脆弱。
  # ★ 抓取配置（observability/prometheus.yml）**必须同时抓两个出口**：
  #   backend:8000 与 worker:9100。只抓 8000 的话，任务类指标
  #   （aigc_tasks_total / celery_task_results_total）永远是 0 ——
  #   那是「告警永远不响」的最隐蔽形态。
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: storekeeper-prometheus
    restart: unless-stopped
    profiles: ["monitoring"]
    depends_on: [backend, worker]
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      # ★ 令牌文件必须**先创建**，否则 Docker 会把不存在的源路径建成
      #   一个空**目录**，Prometheus 启动当场失败（经典坑）：
      #       echo -n "<METRICS_TOKEN 的值>" > observability/metrics_token
      #   本地未设 METRICS_TOKEN 时不需要它 —— 把 prometheus.yml 里
      #   两处 authorization 段删掉即可。
      - ./observability/metrics_token:/etc/prometheus/metrics_token:ro
      - promdata:/prometheus
    ports:
      # 只绑回环：Prometheus 的 UI/API 无鉴权，绝不能对公网开放
      - "127.0.0.1:9090:9090"
    networks: [storekeeper]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: storekeeper-alertmanager
    restart: unless-stopped
    profiles: ["monitoring"]
    volumes:
      - ./observability/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertdata:/alertmanager
    ports:
      - "127.0.0.1:9093:9093"
    networks: [storekeeper]
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager

networks:
  storekeeper:
    driver: bridge

volumes:
  # ★★ pgdata 必须写死这个**裸卷名**：现有运行中的 my-postgres 挂的就是
  #    `pgdata`（docker inspect 实测）。若让 compose 按项目名自动加前缀
  #    （变成 elcommerce_pgdata 之类），compose 会挂一个空卷 → PG 起来是空库，
  #    现象是「所有店铺/用户都不见了」，极易误判成数据丢失。
  pgdata:
    name: pgdata
  # WAL 归档段（P0-2 · PITR）。★ 裸卷名 `pgwal`：本机手工起的 my-postgres
  # 若将来换成 compose 管理，卷名要保持跨环境一致，否则同一条
  # `pg_pitr.py drill` 在两种部署下读到的是不同的归档。
  walarchive:
    name: pgwal
  redisdata:
    name: ecommerce_redisdata
  uploads:
    name: ecommerce_uploads
  logs:
    name: ecommerce_logs
  # 监控数据（Prometheus TSDB / Alertmanager 静默记录）。
  # 与 pgdata 同理：裸卷名 + 项目前缀，避免 compose 自动加项目名后挂空卷。
  promdata:
    name: ecommerce_promdata
  alertdata:
    name: ecommerce_alertdata
