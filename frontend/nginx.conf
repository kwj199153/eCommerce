# ============================================================
#  店管家 AI · 前端 Nginx 站点配置
# ------------------------------------------------------------
#  这份配置解决五件具体的事，每条都对应一个实际踩到的坑：
#
#   0. ★ 后端地址用「变量 + resolver」，**不用 upstream 块**
#      原因：upstream{} 里的 server 名是在 nginx **启动时**解析的，
#      容器网络里如果此刻还没有 backend 这个主机名，nginx 直接
#      `[emerg] host not found in upstream "backend:8000"` 退出 —— **整个网站起不来**。
#      （这是本文件初版的真实故障，实测日志见 docs/project-health-audit-20260915.md）
#      而且就算 backend 先起来了，它一旦重建换了 IP，upstream 仍会拿着旧 IP 一直 502。
#      改用 `resolver` + `set $var` 后，解析推迟到**每次请求**（valid=10s 缓存），
#      nginx 启动不依赖后端，后端重建后 10 秒内自动跟上。
#
#      ⚠️ 代价：失去了 upstream 块的 keepalive 连接复用。
#        对当前量级可以接受；真需要时改成「双 location + try_files 回退」或
#        换 traefik / envoy 这类支持动态服务发现的反代。
#
#   1. SPA history 回退
#      vue-router 用 history 模式，/workspace 这类路径在服务器上并不存在文件。
#      没有 try_files 回退到 index.html 时，用户按 F5 刷新就是 404
#      （开发时 vite dev server 自动处理，所以本地从不复现）。
#
#   2. /api 与 /static 反代到后端
#      开发环境靠 vite 的 proxy 转发；生产是同源部署，必须由 nginx 转发。
#      /static 不能漏 —— AIGC 素材图（万相链接 24h 过期，后端已转存到
#      uploads/ 并挂在 /static）全靠它，漏了就是素材库图片全部挂掉。
#
#   3. 带 hash 的静态资源长缓存、index.html 绝不缓存
#      vite build 产出的 assets/xxx.[hash].js 内容变了文件名就变，
#      可以安全地 cache 1 年；而 index.html 一旦被缓存，
#      用户会一直加载到旧版入口、引用已删除的旧 chunk，表现为「白屏」。
#      ★ 这两个必须成对存在 —— 只做前者不做后者，是最常见的白屏事故。
#
#   4. 上传体积上限
#      后端 max_upload_size_mb=10，nginx 默认 client_max_body_size 只有 1M，
#      不放开的话「上传 Excel 导入」会在 nginx 层直接 413，
#      而且后端日志里一条记录都没有（请求根本没到应用）。
# ============================================================

server {
    listen       80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # 上传体积：后端限 10MB，这里留一倍余量（表单 multipart 有额外开销）
    client_max_body_size 20m;

    # ---------- 0. 后端地址（请求时解析）----------
    # 127.0.0.11 是 Docker 内置 DNS。
    # 非 Docker 部署（nginx 直接跑在宿主机）时，改成宿主机实际 DNS，
    # 或把 $backend_origin 直接写成 IP（IP 不需要解析）。
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_origin "http://backend:8000";

    # ---------- 压缩 ----------
    # 主包 1.5MB 量级，gzip 后收益显著（js/json 通常压到 1/3）
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_comp_level   6;
    gzip_proxied      any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml;

    # ---------- 安全响应头 ----------
    add_header X-Content-Type-Options "nosniff"        always;
    add_header X-Frame-Options        "SAMEORIGIN"     always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    # ★ 注意：这里**不设** Content-Security-Policy。
    #   本项目用 ant-design-vue（大量内联 style）+ echarts（canvas/data URI），
    #   照搬一份严格 CSP 会直接白屏。要上 CSP 必须先实测放行清单。

    # ---------- 1. 带 hash 的前端产物：长缓存 ----------
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ---------- 2. 后端 API ----------
    location /api/ {
        # ★ 变量形式的 proxy_pass 必须显式带上 URI（$request_uri 已含查询串），
        #   否则原始路径会被丢掉 —— 表现为所有接口都打到 "/" 上。
        proxy_pass         $backend_origin$request_uri;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";

        # ★ SSE（Agent 流式输出）必须关缓冲，否则前端会「一次性收到全部内容」，
        #   流式效果完全失效。X-Accel-Buffering 是给 nginx 的显式指令。
        proxy_buffering    off;
        proxy_cache        off;
        proxy_set_header   X-Accel-Buffering no;

        # LLM 生成可能较久（后端 llm_timeout_seconds 默认 120s）
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ---------- 3. 后端静态资源（AIGC 素材图）----------
    location /static/ {
        proxy_pass       $backend_origin$request_uri;
        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # 素材图内容不变，可缓存
        expires 7d;
        add_header Cache-Control "public";
    }

    # ---------- 4. index.html 与 SPA 回退 ----------
    location / {
        # 入口文件绝不缓存：否则用户会拿着旧 index.html 去请求已删除的 chunk → 白屏
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri $uri/ /index.html;
    }

    # 隐藏文件（.env / .git 之类）一律拒绝
    location ~ /\. {
        deny all;
    }
}
