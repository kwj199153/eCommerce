<!--
  店管管 品牌标识 —— 产品站 favicon。

  ★ 底色 `#2b20df` = brand-ink 变量（CSS 变量名前面是两个连字符；定义在
    `src/theme/presets.ts` 的 `BRAND_VARS`，**L1 品牌层**）：

  ★★★ 注释里**不得**出现连续两个短横 —— 那会让整个文件不是合法 XML，
       浏览器加载 favicon 失败后**静默沿用旧图标**（不报错、不警告）。
       第 373~383 轮 tab 上一直是旧项目的蓝底「学」字，原因就是本行曾写成带前缀的变量名。
       ⇒ 判据：`.workbuddy/probes/scan-svg-xml.py`（全仓 svg 必须 100% 可解析）。
    与官网 `site/assets/favicon.svg` **同一个色** —— 两站标识自此一致（第 373 轮）。
    标识底色**不随主题变**：品牌识别的定义就是"不管在哪儿都是这个色"。
    （此前这里是 Vite 的出厂紫色闪电，`index.html` 引的也是 `/vite.svg` —— 从没换过。）

  ★★ 几何真源 = `src/components/BrandMark.vue`；本文件是它的**严格子集**：
     只删掉「笑」那一条 path，其余两条**逐字相同**。
     为什么删：16px 下笑脸弧会与 U 形墙的底边**糊成一体** —— 48 网格里画不出
     16px 还留 1px 间隔的弧，是**结构性下限**，不是选值问题。
     侧栏 / 登录页是 36~48px ⇒ 保笑脸；只有 favicon 这个 16px 场景用派生版。
     判据 `scripts/check-brand-mark.cjs` 的 B2 核对（子集且只少笑脸）。

  ★ 为什么自绘几何而不是图标字体 / 位图：零字体依赖（favicon 正是"最小尺寸 +
    跨设备"的极端场景，同一标识在任何设备上长得一样）、零授权风险、任意尺寸不糊。
    详见 `docs/图形标识设计稿-r373b.html` 与 `docs/品牌标识与品牌色-r373.md`。
-->
