<!--
  店管家 AI 品牌标识 —— 官网 favicon。

  ★ 底色 `#2b20df` = `--brand-ink`（产品站 `src/theme/presets.ts` 的 `BRAND_VARS`；
    本站同值定义在 `assets/style.css` 的 `--brand-ink`）：两站标识自此一致（第 373 轮）。
    此前本站是**柱状图**（三根白柱 + `#4f46e5` 底）—— 柱状图与"店"没有任何可对应的
    形状关系，产品站也与它不同形。现在**几何真源唯一**。

  ★★ 几何真源 = 产品站 `src/components/BrandMark.vue`；本文件是它的**严格子集**：
     只删掉「笑」那一条 path，其余两条**逐字相同**（判据 B3 跨仓对账）。
     为什么删：16px 下笑脸弧会与 U 形墙的底边**糊成一体** —— 48 网格里画不出
     16px 还留 1px 间隔的弧，是**结构性下限**，不是选值问题。
     侧栏 / 登录页是 36~48px ⇒ 保笑脸；只有 favicon 这个 16px 场景用派生版。

  ★ 为什么自绘几何而不是图标字体 / 位图：零字体依赖（favicon 正是"最小尺寸 +
    跨设备"的极端场景，同一标识在任何设备上长得一样）、零授权风险、任意尺寸不糊。
    详见 `docs/图形标识设计稿-r373b.html` 与 `docs/品牌标识与品牌色-r373.md`。
-->
