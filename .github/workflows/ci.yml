# ============================================================
#  CI：后端测试 + 前端类型检查与构建
# ------------------------------------------------------------
#  为什么这两个 job 是最小必需集合：
#    - 后端 pytest（**2435 用例 / 148 文件**，第 347 轮实测）：这是项目里唯一在涨的质量指标，
#      ★ 原写「515+」是第 132 轮前的老数字（严重滞后）。取数命令见
#        docs/review-principles.md §5 的「用例数口径」脚注 —— 每次更新重跑，别沿用旧数。
#      没有 CI 就只能在「想起来的时候」手动跑
#    - 前端 vue-tsc：build 脚本本身就是 `vue-tsc && vite build`，
#      类型不过就出不了包，但本地长期没人跑 ⇒ 类型错误会静默堆积
#
#  ★ 服务容器（PostgreSQL / Redis）是**必需**的，不是可选：
#    测试夹具会真连 PG；缺了会出现大量 error/failure，
#    而这类失败很容易被误判成「代码坏了」并浪费时间排查。
#    本项目的记忆里明确记着这条：PG/Redis DOWN → pytest 大量 F/E
#    是**环境问题不是代码问题**。
#
#  ★★ 后端 job 的「建库」链路（2026-09-15 补齐，缺一条都会让门禁失真）：
#      ① `alembic upgrade head`        —— schema 由迁移建（这才是迁移验证）
#      ② 迁移链自检（单一 head / 往返 / alembic check）
#                                         —— ORM 改了没写迁移 → 立刻红
#      ③ `scripts/bootstrap_db.py`     —— 基础数据（与 main.py lifespan 同源）
#      ④ `pytest`                      —— 此时库 == 「应用首次启动后应有的状态」
#    ①②③ 缺任何一个，「本地全绿」都推不出「CI 全绿」——本仓库三者都曾缺失。
#
#  ⚠️ 静态检查的接入状态（2026-09-17 第 132 轮更新，如实标注）：
#    - ruff：**只接「已收敛到零」的规则子集**（见 backend job 的 Lint 步骤，
#      当前跑 --select T20）。全量基线 2796 条，一次性修不现实 ——
#      每收敛一类就往 --select 加一项，形成棘轮；
#    - mypy：**第 346 轮已接入**（见 backend job 的「类型检查（mypy）」步骤）。
#      接入前的形态与 ruff 那次**同形**：`pyproject.toml` 的 [tool.mypy] 写好了、
#      `requirements-dev.txt` 也装了 mypy，但 CI 里**没有任何一步调用它**
#      ⇒ 同为纸面门禁（这次连"配置就绪"都写得很完整，所以更难看出来）。
#      口径：同 ruff 的棘轮 —— 只查**已收敛到零**的目标（`core ai_infra`），
#      每收敛一批就往目标里加目录，只增不减。
#      ★ 接入时顺手修掉两条 blocking（它们会让 mypy **一个字符都检查不到**）：
#        ① [tool.mypy] python_version 写 "3.11"，而 venv 实为 CPython 3.12.14
#           ⇒ 读已装依赖的 numpy stub 直接 syntax 错 +
#             "errors prevented further checking"（退出码 2，看着像全绿）；
#        ② 无参数 `mypy` 从 CWD 递归收集，`tests/` 与 `scripts/` 各有一份
#           `conftest.py` ⇒ `Duplicate module named "conftest"`（退出码 2）
#           ⇒ 必须**显式给检查目标**。
#      ★ 基线口径更正：`mypy core ai_infra` 的真实基线是 **74 条 / 18 文件**，
#        不是早期文档里的 48。48 是「先跑 py311（abort 于 stub）→ 复用同一份
#        缓存再跑 py312」的**欠计**产物：mypy 的检查面积取决于**缓存状态**，
#        换 --cache-dir 会静默少报（实测同一 commit 下 299/231/205 三个数）。
#        详见 docs/baseline-r345-lint.md 的更正说明。
#    - 前端 ESLint：**第 346 轮已接入**（见 frontend job 的 `npm run lint:ci` 步骤）。
#      接入前的形态与本仓 ruff 那次同形 —— `package.json` 里有 `lint` 脚本，
#      但 `devDependencies` 里**没有任何 eslint 包**，脚本还写着 `--ext`
#      （该参数在 ESLint 9 已被移除）且带 `--fix`（破坏性）⇒ 从未执行过。
#      现在的口径：基线 8116 条问题**全部**出自 21 条规则，那 21 条显式关闭并登记欠账
#      （`frontend/eslint.config.mjs` 的 `LEGACY_DEBT_OFF`），其余 181 条生效规则
#      由 `eslint . --max-warnings=0` 拦住 ⇒ 稳态 0 problem。
#      棘轮不靠注释约定：`frontend/scripts/check-eslint-ratchet.cjs` 用 ESLint 自己的
#      `calculateConfigForFile` 解析真实档位，守住「生效集合不缩水、欠账不扩张」，
#      它按 `check-*.*` glob 自动进下面那个门禁步骤。
#    - 前端 `scripts/check-*.py` 门禁：**第 161 轮已接进 CI**。此前 glob 写死
#      `.cjs` 后缀（且 .py 用下划线命名，连 `check-*` 都匹配不上）⇒ 两道门禁
#      存在却从未执行。现改 `check-*.*` + 覆盖率自证 + 文件名统一连字符；
#    - 覆盖率 / 安全扫描：**已接入**（见 backend job 的覆盖率步骤与 security job）；
#      npm audit 暂以 critical 为线，3 项 high 是已知待办（理由写在 security job 里）。
#    - CD 资产门禁：**已接入**（assets job 的 `CD 资产门禁` 步骤，第 333 轮）。
#      CD 的三份资产（.github/workflows/cd.yml / scripts/deploy/remote_deploy.sh /
#      docker-compose.yml 的 image 插值）之间的一致性没人替你检查，
#      且失配形态全是静默失效（行尾 CRLF、镜像名对不上、回滚被删、数据面进 up 列表）。
# ============================================================

name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  # 允许手动触发（排障时不必空提交一次）
  workflow_dispatch:

# 同一分支的新推送取消旧的进行中任务，避免排队堆积
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"

jobs:
  # ================= 后端 =================
  backend:
    name: 后端测试（pytest）
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: kevin
          POSTGRES_PASSWORD: "123456"
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        # 必须等健康检查通过再跑测试：容器"已启动"与"能接受连接"是两件事
        options: >-
          --health-cmd "pg_isready -U kevin -d postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    env:
      # 与 .env.example 对齐的测试环境变量。
      # ★ AUTH_REQUIRED=false：测试套件要覆盖「演示模式放行」这条分支；
      #   生产模式的鉴权行为由 test_auth_and_tenant.py 里的 auth_on 夹具单独开关。
      AUTH_REQUIRED: "false"
      DATABASE_URL: postgresql+asyncpg://kevin:123456@localhost:5432/postgres
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/1
      CELERY_RESULT_BACKEND: redis://localhost:6379/2
      # 限流在测试里必须关：几百个请求会在几十秒内触发 60/min 阈值
      RATE_LIMIT_ENABLED: "false"
      # 不配 DASHSCOPE_API_KEY：测试不应消耗真实 LLM 配额。
      # 需要真调 LLM 的用例应自行 skip（用 pytest.mark.skipif）。
      DASHSCOPE_API_KEY: ""

    steps:
      - uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: 安装依赖
        # ★ 必须同时装 requirements-dev.txt：本 job 要跑 lint 与覆盖率，
        #   而这些工具**只在 dev 清单里**。这正是本仓库真实踩过的坑 ——
        #   pyproject.toml 里写好了 [tool.ruff] 配置，但 requirements.txt
        #   里没有任何 lint 工具 ⇒ CI 根本装不上 ruff ⇒ 配置从写下那天起
        #   就是纸面门禁。"配置与依赖必须成对出现"。
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: 语法编译检查（快速失败，不用等测试跑完）
        # 编译全部 .py：能抓住缩进/语法级错误，几秒钟出结果
        run: python -m compileall -q core modules platforms ai_infra main.py worker.py

      - name: 确认 app 可导入（抓循环导入 / 配置校验误拦）
        run: python -c "import main; print('routes =', len(main.app.routes))"

      - name: 建库（跑迁移 —— 不用 create_all）
        # ★★ 为什么必须是 alembic，而不是 create_all：
        #    create_all 直接按 ORM 的 metadata 建表，**永远不会发现**迁移断链、
        #    漏表、依赖顺序错误 —— 也就是说它根本不构成「迁移验证」。
        #    本仓库此前正是「init 迁移 5fe72f9a9520 的 upgrade() 只有 pass」
        #    + 全靠 dev 环境 create_all 兜底 ⇒ 空库 upgrade 必炸；
        #    而 CI 连建库步骤都没有 ⇒ 这是一个**从未真正绿过的假门禁**。
        run: python -m alembic upgrade head

      - name: 迁移链完整性自检
        # 三条独立断言，任一失败即红。
        # 命令序列已在本机全新空库上实测通过（探针 script-r51_ci_migration_dryrun.py，
        # 该探针本身也抓到过一个真 bug：drop_table 不删 PG ENUM 类型 ⇒ 往返必炸）。
        run: |
          set -e
          echo "--- ① 单一 head（有分叉时 upgrade head 会歧义）"
          heads=$(python -m alembic heads 2>/dev/null | grep -c '(head)')
          test "$heads" -eq 1
          echo "--- ② 往返：downgrade base -> upgrade head（验证降级真的可用，不是摆设）"
          python -m alembic downgrade base
          python -m alembic upgrade head
          echo "--- ③ ORM 与迁移一致性：模型改了却没生成迁移 -> 这里红"
          python -m alembic check

      - name: 灌基础数据（与 main.py 启动路径同源）
        # ★★ 为什么必须有这一步：CI 的 PG 是**全新空容器**，而本地 pytest 跑的是
        #    **有数据的开发库** ⇒「本地全绿」推不出「CI 全绿」。
        #    实测（探针 script-r51_ci_e2e.py）：只建表不灌数据时直接跑 pytest，
        #    注册/订阅链路因 subscription_plans 空表而外键失败，大面积 ERROR：
        #      ForeignKeyViolationError: subscriptions ... plan_id=1
        #        is not present in table "subscription_plans"
        #    本步骤与 main.py 的 lifespan 共用 core/bootstrap.py（唯一真源），
        #    所以不会出现「启动会灌、CI 不灌」两套清单各自漂移。
        run: python scripts/bootstrap_db.py

      - name: Lint（只跑已收敛到零的规则）
        # ★ 为什么不是全量 `ruff check .`：
        #   全量基线 **2796 条**（UP045/UP006/I001 占大头，2380 条可自动修）。
        #   一次性修完不现实；硬接上去只会被人 --no-verify 绕过，
        #   最后"有 CI 但没人信"。所以只跑**已经收敛到零**的规则子集 ——
        #   每收敛一类就往 --select 里加一项，形成**棘轮**：只增不减。
        #   当前已收敛：
        #     T20 —— 生产代码里不得出现 print（scripts/ 与演示型测试已按文件豁免，
        #            理由写在 backend/pyproject.toml 的 per-file-ignores 注释里）
        run: ruff check . --select T20

      - name: 类型检查（mypy：棘轮 —— 只查已收敛到零的目录）
        # ★ 与上一步 ruff 同一套棘轮思路：**不给全仓**，只给「已收敛到零」的
        #   目标目录；每收敛一批就往目标里加一个，只增不减。
        # ★★ 为什么必须**显式给目标**、不能只写 `mypy`：
        #    无参数时 mypy 从 CWD 递归收集全部 .py，而 `tests/` 与 `scripts/`
        #    下各有一份 `conftest.py` ⇒ `Duplicate module named "conftest"`，
        #    退出码 2 却**一条检查都没做**；且 `follow_imports = "silent"`
        #    会把它拖进 modules/platforms，报出几百条与本次收敛无关的存量错误。
        # ★ 当前已收敛：core / ai_infra（第 346 轮，74 条 → 0）。
        # ★ 判据是「退出码 + Success 行」，不是"有没有输出"：mypy 报
        #   "errors prevented further checking" 时也用退出码 2，必须当失败看。
        # ★ 与 tests/test_core_layering.py（core 不得 import modules）互补：
        #   那条守分层红线，这条守类型正确性。
        run: mypy core ai_infra

      - name: 跑测试（含覆盖率门禁）
        # ★ 覆盖率的口径与阈值在 backend/pyproject.toml 的 [tool.coverage.*] 里，
        #   这里不重复写 fail_under / branch / omit —— 两处都写必然漂移，
        #   而"改了不生效"的那个地方永远是没人看的那份。
        # ★ 但**覆盖率目标必须在这里显式列**（--cov=core --cov=modules ...）：
        #   pyproject 的 [tool.coverage.run] 里**不能**写 source ——
        #   coverage 对配置里的 source 会 importlib.import_module() 去定位包，
        #   把 `main` 列进去就会真的 import main.py（执行顶层代码、注册全部路由），
        #   导致 SQLAlchemy 表重复注册、6 个测试文件在 collection 阶段 ERROR
        #   （第 132 轮本地实测，详见 pyproject 里的说明）。
        #   而 pytest-cov 的 --cov=X 走路径处理、不 import ⇒ 只能从这里给。
        # fail_under = 65 是**棘轮**（锁住"不许比现在更差"），不是目标值；
        # 要提高必须先补测试、实测新基线、再抬阈值，顺序不能反。
        run: |
          pytest tests/ -q --no-header \
            --cov=core --cov=modules --cov=platforms --cov=ai_infra \
            --cov=main --cov=worker \
            --cov-report=term-missing --cov-report=xml

      - name: 上传覆盖率报告
        # if: always() —— 覆盖率不达标时这一步也要跑，否则"红在哪"没有报告可看
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml
          if-no-files-found: ignore

  # ================= 前端 =================
  frontend:
    name: 前端类型检查与构建
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装依赖
        # npm ci 严格按 lock 安装，保证 CI 与本地一致
        run: npm ci

      - name: 安装 Python（.py 门禁用）
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 前端门禁（静态真伪检查）
        # ★★ 为什么必须显式跑这一步：
        #   `package.json` 的 `build` 里串着一批 `check-*.cjs`，
        #   而本 job 之前跑的是 `npx vue-tsc` + `npx vite build`
        #   —— **绕过了 build 脚本** ⇒ 这些门禁从未在 CI 里执行过。
        #   第 155 轮新增的 `check-plan-consumption.cjs` 因此是 CI 里的死脚本
        #   —— 典型「配置写了但不生效」。
        #   用 **glob** 而不是逐条列举：新增门禁自动纳入，不会再漂移。
        #
        # ★★ 第 161 轮修（同类缺陷第二次出现，这次换了后缀）：
        #   原 glob 写的是 `scripts/check-*.cjs` —— 后缀限定成 `.cjs`，
        #   于是 `scripts/check-theme-boot.py` / `scripts/check-app-actions.py`
        #   两道真实存在的门禁**从未在 CI 里执行过**。更隐蔽的是：
        #   它们连 `check-*` 都匹配不上（原名用下划线 `check_theme_boot.py`），
        #   所以「门禁存在但静默不执行」有两层原因 —— 后缀 + 分隔符。
        #   修法 = ①文件名后缀分隔符统一成 `-`；②glob 放开到 `check-*.*`；
        #          ③下面加「覆盖率自证」，谁再被排除就直接红。
        #
        # ★ 为什么 `.py` 门禁**没有**并进 `npm run build`：
        #   `frontend/Dockerfile` 的构建阶段是 `node:22-alpine`（**镜像里没有 python**），
        #   并进 build 会让 `RUN npm run build` 直接失败、镜像构建挂掉。
        #   ⇒ build 保持只跑 `.cjs`；`.py` 由本步骤 + `npm run check:py` 承担。
        run: |
          set -e
          shopt -s nullglob
          ran=0
          for f in scripts/check-*.*; do
            echo "--- $f"
            case "$f" in
              *.cjs) node "$f" ;;
              *.py)  python "$f" ;;
              *)
                echo "::error::门禁 $f 后缀未知，无法执行（新增门禁请用 .cjs 或 .py）"
                exit 1
                ;;
            esac
            ran=$((ran + 1))
          done
          # ★ 覆盖率自证：`check-*`（**不限后缀**）都必须被上面那条 glob 跑到。
          #   少了就是「门禁文件在、却从未被执行」—— 正是本轮修掉的缺陷形态。
          total=$(ls -1 scripts/check-* | wc -l)
          if [ "$ran" -ne "$total" ]; then
            echo "::error::门禁覆盖率不足：磁盘 $total 个，实际执行 $ran 个"
            echo "被排除的文件：$(ls -1 scripts/check-* | tr '\n' ' ')"
            exit 1
          fi
          echo "前端门禁执行 $ran/$total 个 ✓"

      - name: ESLint（棘轮：已收敛到零的规则集）
        # ★★ 为什么必须有这一步：本仓 `package.json` 里一直有 `lint` 脚本，
        #   但 `devDependencies` 里没有任何 eslint 包 ⇒ 那是**死脚本**，
        #   从写下那天起从未在 CI 里执行过（「配置写了但不生效」，与 ruff 那次同形）。
        #   第 346 轮补齐 devDeps + `eslint.config.mjs`，并在这里接上。
        #
        # ★ 为什么跑 `lint:ci` 而不是 `npx eslint .`：
        #   棘轮第一档里有 21 条规则是 **warn 档**（它们在基线里零违规），
        #   只判 error 的话这 21 条就没有牙齿 ⇒ `--max-warnings=0` 让 warning 也算失败。
        #
        # ★ 为什么这不是「又一道常红的门禁」：基线 8116 条问题全部出自 21 条规则，
        #   那 21 条已显式关闭并登记为欠账；其余 181 条生效规则当前零违规
        #   ⇒ 本步骤的稳态就是 0 problem。每清掉一类欠账就从欠账表删一条（回到预设档位 = 收紧）。
        #
        # ★ 旧脚本为什么不能直接用：`--ext` 在 ESLint 9 已移除（连参数都过不去），
        #   而且它带 `--fix` —— 会改写工作区且**永远退出 0**，在 CI 里既破坏性又不判红。
        run: npm run lint:ci

      - name: 类型检查
        run: npx vue-tsc --noEmit

      - name: 单元测试（Vitest）
        # ★ 第 355 轮 #1282 新增：前端从「零单测」起步（vitest@2 + tests/unit/）。
        #   此前前端只有 `scripts/check-*.cjs` 那类**静态真伪检查**（扫源码字符串 /
        #   扫 AST 形态），它们证明「代码长成什么样」，但**执行不到任何一行运行期逻辑**。
        #   纯函数（颜色语义映射、相似度排序）的行为此前完全没人守 —— 改了算法参数，
        #   所有门禁照旧全绿（项目记忆：「没被反向注入验证过的门禁 = 没有门禁」）。
        #
        # ★ 为什么跑 `npm run test` 而不是 `npx vitest run`：
        #   与本地完全同一条命令（脚本里 = `vitest run`）。
        #   直接用 npx 会在「改了脚本、CI 没跟着改」时静默跑另一套参数。
        #
        # ★ 为什么不并进 `npm run build`：
        #   build 会被 `frontend/Dockerfile` 的构建阶段执行，而那是 `node:22-alpine`
        #   且只装生产依赖 ⇒ 里面没有 vitest（devDependency），并进去会让镜像构建直接失败。
        #   这正是 `.py` 门禁当初不进 build 的同一条理由。
        run: npm run test

      - name: 构建
        # ★ 显式关闭演示模式：CI 出的包不应带 demo-token 直通
        env:
          VITE_DEMO_MODE: "false"
        run: npx vite build

      - name: 检查构建产物存在
        # 构建"成功但没有产物"是可能的（配置写错输出目录）
        run: test -f dist/index.html

  # ================= 部署资产自检 =================
  assets:
    name: 部署资产完整性
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: 必需文件存在
        # 这几样是「能不能交付」的硬门槛，缺一条就部署不了。
        # 做成 CI 检查是为了防止被误删后没人发现（此前就处于全缺状态）。
        run: |
          set -e
          for f in \
            backend/Dockerfile \
            backend/.dockerignore \
            frontend/Dockerfile \
            frontend/nginx.conf \
            frontend/.dockerignore \
            docker-compose.yml \
            README.md \
            backend/pyproject.toml
          do
            if [ ! -f "$f" ]; then
              echo "::error file=$f::缺少部署资产：$f"
              exit 1
            fi
            echo "OK  $f"
          done

      - name: 校验 compose 语法
        run: docker compose config --quiet

      - name: 校验 nginx 配置语法
        # nginx -t 需要真实配置文件树，用容器跑一次最快
        run: |
          docker run --rm \
            -v "$PWD/frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro" \
            nginx:1.27-alpine nginx -t

      - name: 敏感文件不得入库
        # ★ 防止 .env（含真实密钥）被提交上来。这条检查成本极低，
        #   但漏掉的代价是密钥泄露到 git 历史里（改密钥都洗不干净）。
        run: |
          set -e
          if git ls-files --error-unmatch backend/.env >/dev/null 2>&1; then
            echo "::error::backend/.env 已被 git 跟踪，密钥会进版本库！请 git rm --cached 并轮换密钥"
            exit 1
          fi
          if git ls-files --error-unmatch frontend/.env.local >/dev/null 2>&1; then
            echo "::error::frontend/.env.local 已被 git 跟踪（本机覆盖文件不应入库）"
            exit 1
          fi
          echo "OK 敏感文件未被跟踪"

      - name: 安装 Python（CD 资产门禁用）
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: CD 资产门禁
        # ★ 为什么 CD 资产需要专门一道门禁（而不是"看着没问题就行"）：
        #   CD 的三份资产分居三个文件 —— workflow / 部署脚本 / compose 的镜像插值 ——
        #   它们之间的**一致性**没有任何编译器或测试会替你检查。四类静默失效：
        #     · 脚本被写成 CRLF  → 远端 `bash -s` 报 $'\r': command not found，
        #                          而本地 Git Bash 的 `bash -n` 照样通过（本地绿、远端红）；
        #     · 镜像名两边改歪    → 构建推 A、compose 拉 B ⇒ 部署拉不到镜像；
        #     · 回滚/健康检查被删 → 部署"看似成功"，出事时无法恢复；
        #     · 数据面进 up 列表  → 每次发版都 recreate 数据库（中断连接且无法回滚）。
        #   判据形态：cd.yml 走 YAML 解析、shell 能力用行首定义形态、
        #   镜像名用**集合相等**对账 —— 都不靠 grep 字符串包含（会被注释骗过）。
        #   已通过 8 类反向注入自检：.workbuddy/probes/r333_cd_gate_injection.py
        run: |
          python -m pip install --quiet pyyaml
          python scripts/check-cd-assets.py

  # ================= 安全扫描 =================
  security:
    name: 安全扫描（bandit / pip-audit / npm audit）
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: 安装扫描工具
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: bandit（代码安全扫描）
        # 配置在 backend/pyproject.toml 的 [tool.bandit]（targets/exclude_dirs/skips）。
        # -ll 只报 Medium 及以上：Low 级在本项目全是噪声（测试 assert、mock 随机数）。
        # 当前 Medium+ = 0（6 处 B324 弱哈希已改为 usedforsecurity=False，
        # 它们都是"内容寻址/文件名生成"，不是安全哈希）。
        # ★ 第 357 轮复验：上面那句当时**是假的** —— 另有 2 处弱哈希漏改
        #   （modules/aigc_media/agent_aigc.py 的 md5、ai_infra/memory/entry.py
        #   的 sha1），本 job 实际为红。已补齐；同时给 [tool.bandit].exclude_dirs
        #   加了 .venv/.workbuddy，否则本地 `-r .` 会递归进 venv 扫出 295 条误报。
        working-directory: backend
        run: python -m bandit -c pyproject.toml -r . -ll

      - name: pip-audit（后端依赖漏洞）
        # ★ 显式忽略 PYSEC-2026-1325（ecdsa），理由有据可查：
        #   ① 该漏洞**没有修复版本**（pip-audit 的 Fix Versions 列为空）；
        #   ② 本项目 JWT 用 HS256（config.jwt_algorithm 默认值 + .env 实测），
        #      而 ecdsa 只在 ES256/ES384 的签名验签路径上参与 —— 本项目不经过；
        #   ③ ecdsa 是 python-jose 的传递依赖，实际密码学实现由 [cryptography] extra 提供。
        #   ⇒ 这是**有依据的例外**，不是"红色太多先关掉"。
        #   处置：跟踪 python-jose 上游是否移除对 ecdsa 的硬依赖。
        working-directory: backend
        run: python -m pip_audit -r requirements.txt --ignore-vuln PYSEC-2026-1325

      - name: npm audit（前端依赖漏洞）
        # ★ 门禁为什么定在 critical 而不是 high：
        #   当前 high 有 3 项、且**都无法在本轮修**：
        #     · vite（devDependency，仅构建期）：修复要 5.x → 8.x 的 major 升级，
        #       跨越 3 个大版本，属于独立改造任务，不能顺手塞进来；
        #     · xlsx（**生产依赖**）：SheetJS 已不在 npm 上发新版（fixAvailable: false），
        #       要么改用官方 CDN 源安装、要么整体换 exceljs —— 需要单独评估。
        #     · brace-expansion@1.1.21（devDependency 的**传递**依赖，仅构建期）：
        #       第 346 轮接入 ESLint 时随 `minimatch@3` 树进来（ReDoS 类公告）。
        #       它不在生产依赖链上、也不在运行期被调用，实际风险低；
        #       要修得动 ESLint 自己的依赖树（用 `overrides` 强升 brace-expansion 2.x
        #       与 minimatch@3 的调用方式不兼容）⇒ 同样属于独立评估。
        #   门禁若定在 high，CI 会**立刻常红**，最后必然被人绕过或关掉
        #   （本仓库记忆里有明确一条：门禁一亮红就被 --no-verify 绕过）。
        #   所以先锁 critical（当前 0 ⇒ 绿），把 high 当**已知待办**跟踪，
        #   每修掉一个就把 --audit-level 收紧一档。
        working-directory: frontend
        run: npm audit --audit-level=critical
