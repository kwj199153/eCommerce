# ============================================================
#  CI：后端测试 + 前端类型检查与构建
# ------------------------------------------------------------
#  为什么这两个 job 是最小必需集合：
#    - 后端 pytest（515+ 用例）：这是项目里唯一在涨的质量指标，
#      没有 CI 就只能在「想起来的时候」手动跑
#    - 前端 vue-tsc：build 脚本本身就是 `vue-tsc && vite build`，
#      类型不过就出不了包，但本地长期没人跑 ⇒ 类型错误会静默堆积
#
#  ★ 服务容器（PostgreSQL / Redis）是**必需**的，不是可选：
#    测试夹具会真连 PG；缺了会出现大量 error/failure，
#    而这类失败很容易被误判成「代码坏了」并浪费时间排查。
#    本项目的记忆里明确记着这条：PG/Redis DOWN → pytest 大量 F/E
#    是**环境问题不是代码问题**。
#
#  ★★ 后端 job 的「建库」链路（2026-09-15 补齐，缺一条都会让门禁失真）：
#      ① `alembic upgrade head`        —— schema 由迁移建（这才是迁移验证）
#      ② 迁移链自检（单一 head / 往返 / alembic check）
#                                         —— ORM 改了没写迁移 → 立刻红
#      ③ `scripts/bootstrap_db.py`     —— 基础数据（与 main.py lifespan 同源）
#      ④ `pytest`                      —— 此时库 == 「应用首次启动后应有的状态」
#    ①②③ 缺任何一个，「本地全绿」都推不出「CI 全绿」——本仓库三者都曾缺失。
#
#  ⚠️ 静态检查的接入状态（2026-09-17 第 132 轮更新，如实标注）：
#    - ruff：**只接「已收敛到零」的规则子集**（见 backend job 的 Lint 步骤，
#      当前跑 --select T20）。全量基线 2796 条，一次性修不现实 ——
#      每收敛一类就往 --select 加一项，形成棘轮；
#    - mypy：**仍未接入**（存量无标注，接入前要先跑基线）；
#    - 前端 ESLint：package.json 有 lint 脚本，但 devDependencies 里**没有 eslint**
#      ⇒ 该脚本是死的，直接加进 CI 会失败。补 devDeps + 配置文件是独立任务；
#    - 覆盖率 / 安全扫描：**已接入**（见 backend job 的覆盖率步骤与 security job）；
#      npm audit 暂以 critical 为线，2 项 high 是已知待办（理由写在 security job 里）。
# ============================================================

name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  # 允许手动触发（排障时不必空提交一次）
  workflow_dispatch:

# 同一分支的新推送取消旧的进行中任务，避免排队堆积
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"

jobs:
  # ================= 后端 =================
  backend:
    name: 后端测试（pytest）
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: kevin
          POSTGRES_PASSWORD: "123456"
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        # 必须等健康检查通过再跑测试：容器"已启动"与"能接受连接"是两件事
        options: >-
          --health-cmd "pg_isready -U kevin -d postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    env:
      # 与 .env.example 对齐的测试环境变量。
      # ★ AUTH_REQUIRED=false：测试套件要覆盖「演示模式放行」这条分支；
      #   生产模式的鉴权行为由 test_auth_and_tenant.py 里的 auth_on 夹具单独开关。
      AUTH_REQUIRED: "false"
      DATABASE_URL: postgresql+asyncpg://kevin:123456@localhost:5432/postgres
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/1
      CELERY_RESULT_BACKEND: redis://localhost:6379/2
      # 限流在测试里必须关：几百个请求会在几十秒内触发 60/min 阈值
      RATE_LIMIT_ENABLED: "false"
      # 不配 DASHSCOPE_API_KEY：测试不应消耗真实 LLM 配额。
      # 需要真调 LLM 的用例应自行 skip（用 pytest.mark.skipif）。
      DASHSCOPE_API_KEY: ""

    steps:
      - uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: 安装依赖
        # ★ 必须同时装 requirements-dev.txt：本 job 要跑 lint 与覆盖率，
        #   而这些工具**只在 dev 清单里**。这正是本仓库真实踩过的坑 ——
        #   pyproject.toml 里写好了 [tool.ruff] 配置，但 requirements.txt
        #   里没有任何 lint 工具 ⇒ CI 根本装不上 ruff ⇒ 配置从写下那天起
        #   就是纸面门禁。"配置与依赖必须成对出现"。
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: 语法编译检查（快速失败，不用等测试跑完）
        # 编译全部 .py：能抓住缩进/语法级错误，几秒钟出结果
        run: python -m compileall -q core modules platforms ai_infra main.py worker.py

      - name: 确认 app 可导入（抓循环导入 / 配置校验误拦）
        run: python -c "import main; print('routes =', len(main.app.routes))"

      - name: 建库（跑迁移 —— 不用 create_all）
        # ★★ 为什么必须是 alembic，而不是 create_all：
        #    create_all 直接按 ORM 的 metadata 建表，**永远不会发现**迁移断链、
        #    漏表、依赖顺序错误 —— 也就是说它根本不构成「迁移验证」。
        #    本仓库此前正是「init 迁移 5fe72f9a9520 的 upgrade() 只有 pass」
        #    + 全靠 dev 环境 create_all 兜底 ⇒ 空库 upgrade 必炸；
        #    而 CI 连建库步骤都没有 ⇒ 这是一个**从未真正绿过的假门禁**。
        run: python -m alembic upgrade head

      - name: 迁移链完整性自检
        # 三条独立断言，任一失败即红。
        # 命令序列已在本机全新空库上实测通过（探针 script-r51_ci_migration_dryrun.py，
        # 该探针本身也抓到过一个真 bug：drop_table 不删 PG ENUM 类型 ⇒ 往返必炸）。
        run: |
          set -e
          echo "--- ① 单一 head（有分叉时 upgrade head 会歧义）"
          heads=$(python -m alembic heads 2>/dev/null | grep -c '(head)')
          test "$heads" -eq 1
          echo "--- ② 往返：downgrade base -> upgrade head（验证降级真的可用，不是摆设）"
          python -m alembic downgrade base
          python -m alembic upgrade head
          echo "--- ③ ORM 与迁移一致性：模型改了却没生成迁移 -> 这里红"
          python -m alembic check

      - name: 灌基础数据（与 main.py 启动路径同源）
        # ★★ 为什么必须有这一步：CI 的 PG 是**全新空容器**，而本地 pytest 跑的是
        #    **有数据的开发库** ⇒「本地全绿」推不出「CI 全绿」。
        #    实测（探针 script-r51_ci_e2e.py）：只建表不灌数据时直接跑 pytest，
        #    注册/订阅链路因 subscription_plans 空表而外键失败，大面积 ERROR：
        #      ForeignKeyViolationError: subscriptions ... plan_id=1
        #        is not present in table "subscription_plans"
        #    本步骤与 main.py 的 lifespan 共用 core/bootstrap.py（唯一真源），
        #    所以不会出现「启动会灌、CI 不灌」两套清单各自漂移。
        run: python scripts/bootstrap_db.py

      - name: Lint（只跑已收敛到零的规则）
        # ★ 为什么不是全量 `ruff check .`：
        #   全量基线 **2796 条**（UP045/UP006/I001 占大头，2380 条可自动修）。
        #   一次性修完不现实；硬接上去只会被人 --no-verify 绕过，
        #   最后"有 CI 但没人信"。所以只跑**已经收敛到零**的规则子集 ——
        #   每收敛一类就往 --select 里加一项，形成**棘轮**：只增不减。
        #   当前已收敛：
        #     T20 —— 生产代码里不得出现 print（scripts/ 与演示型测试已按文件豁免，
        #            理由写在 backend/pyproject.toml 的 per-file-ignores 注释里）
        run: ruff check . --select T20

      - name: 跑测试（含覆盖率门禁）
        # ★ 覆盖率的口径与阈值在 backend/pyproject.toml 的 [tool.coverage.*] 里，
        #   这里不重复写 fail_under / branch / omit —— 两处都写必然漂移，
        #   而"改了不生效"的那个地方永远是没人看的那份。
        # ★ 但**覆盖率目标必须在这里显式列**（--cov=core --cov=modules ...）：
        #   pyproject 的 [tool.coverage.run] 里**不能**写 source ——
        #   coverage 对配置里的 source 会 importlib.import_module() 去定位包，
        #   把 `main` 列进去就会真的 import main.py（执行顶层代码、注册全部路由），
        #   导致 SQLAlchemy 表重复注册、6 个测试文件在 collection 阶段 ERROR
        #   （第 132 轮本地实测，详见 pyproject 里的说明）。
        #   而 pytest-cov 的 --cov=X 走路径处理、不 import ⇒ 只能从这里给。
        # fail_under = 65 是**棘轮**（锁住"不许比现在更差"），不是目标值；
        # 要提高必须先补测试、实测新基线、再抬阈值，顺序不能反。
        run: |
          pytest tests/ -q --no-header \
            --cov=core --cov=modules --cov=platforms --cov=ai_infra \
            --cov=main --cov=worker \
            --cov-report=term-missing --cov-report=xml

      - name: 上传覆盖率报告
        # if: always() —— 覆盖率不达标时这一步也要跑，否则"红在哪"没有报告可看
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml
          if-no-files-found: ignore

  # ================= 前端 =================
  frontend:
    name: 前端类型检查与构建
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装依赖
        # npm ci 严格按 lock 安装，保证 CI 与本地一致
        run: npm ci

      - name: 前端门禁（静态真伪检查）
        # ★★ 为什么必须显式跑这一步：
        #   `package.json` 的 `build` = `8 道 check-*.cjs && vue-tsc && vite build`，
        #   而本 job 之前跑的是 `npx vue-tsc` + `npx vite build`
        #   —— **绕过了 build 脚本** ⇒ 这 8 道门禁从未在 CI 里执行过。
        #   它们之前只在两处真跑：本地 `npm run build`，
        #   以及 `frontend/Dockerfile` 的 `RUN npm run build`。
        #   第 155 轮新增的 `check-plan-consumption.cjs` 因此是 CI 里的死脚本
        #   —— 典型「配置写了但不生效」。
        #   用 **glob** 而不是逐条列举：新增门禁自动纳入，不会再漂移。
        run: |
          set -e
          for f in scripts/check-*.cjs; do
            echo "::group::$f"
            node "$f"
            echo "::endgroup::"
          done

      - name: 类型检查
        run: npx vue-tsc --noEmit

      - name: 构建
        # ★ 显式关闭演示模式：CI 出的包不应带 demo-token 直通
        env:
          VITE_DEMO_MODE: "false"
        run: npx vite build

      - name: 检查构建产物存在
        # 构建"成功但没有产物"是可能的（配置写错输出目录）
        run: test -f dist/index.html

  # ================= 部署资产自检 =================
  assets:
    name: 部署资产完整性
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: 必需文件存在
        # 这几样是「能不能交付」的硬门槛，缺一条就部署不了。
        # 做成 CI 检查是为了防止被误删后没人发现（此前就处于全缺状态）。
        run: |
          set -e
          for f in \
            backend/Dockerfile \
            backend/.dockerignore \
            frontend/Dockerfile \
            frontend/nginx.conf \
            frontend/.dockerignore \
            docker-compose.yml \
            README.md \
            backend/pyproject.toml
          do
            if [ ! -f "$f" ]; then
              echo "::error file=$f::缺少部署资产：$f"
              exit 1
            fi
            echo "OK  $f"
          done

      - name: 校验 compose 语法
        run: docker compose config --quiet

      - name: 校验 nginx 配置语法
        # nginx -t 需要真实配置文件树，用容器跑一次最快
        run: |
          docker run --rm \
            -v "$PWD/frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro" \
            nginx:1.27-alpine nginx -t

      - name: 敏感文件不得入库
        # ★ 防止 .env（含真实密钥）被提交上来。这条检查成本极低，
        #   但漏掉的代价是密钥泄露到 git 历史里（改密钥都洗不干净）。
        run: |
          set -e
          if git ls-files --error-unmatch backend/.env >/dev/null 2>&1; then
            echo "::error::backend/.env 已被 git 跟踪，密钥会进版本库！请 git rm --cached 并轮换密钥"
            exit 1
          fi
          if git ls-files --error-unmatch frontend/.env.local >/dev/null 2>&1; then
            echo "::error::frontend/.env.local 已被 git 跟踪（本机覆盖文件不应入库）"
            exit 1
          fi
          echo "OK 敏感文件未被跟踪"

  # ================= 安全扫描 =================
  security:
    name: 安全扫描（bandit / pip-audit / npm audit）
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: 安装扫描工具
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: bandit（代码安全扫描）
        # 配置在 backend/pyproject.toml 的 [tool.bandit]（targets/exclude_dirs/skips）。
        # -ll 只报 Medium 及以上：Low 级在本项目全是噪声（测试 assert、mock 随机数）。
        # 当前 Medium+ = 0（6 处 B324 弱哈希已改为 usedforsecurity=False，
        # 它们都是"内容寻址/文件名生成"，不是安全哈希）。
        working-directory: backend
        run: python -m bandit -c pyproject.toml -r . -ll

      - name: pip-audit（后端依赖漏洞）
        # ★ 显式忽略 PYSEC-2026-1325（ecdsa），理由有据可查：
        #   ① 该漏洞**没有修复版本**（pip-audit 的 Fix Versions 列为空）；
        #   ② 本项目 JWT 用 HS256（config.jwt_algorithm 默认值 + .env 实测），
        #      而 ecdsa 只在 ES256/ES384 的签名验签路径上参与 —— 本项目不经过；
        #   ③ ecdsa 是 python-jose 的传递依赖，实际密码学实现由 [cryptography] extra 提供。
        #   ⇒ 这是**有依据的例外**，不是"红色太多先关掉"。
        #   处置：跟踪 python-jose 上游是否移除对 ecdsa 的硬依赖。
        working-directory: backend
        run: python -m pip_audit -r requirements.txt --ignore-vuln PYSEC-2026-1325

      - name: npm audit（前端依赖漏洞）
        # ★ 门禁为什么定在 critical 而不是 high：
        #   当前 high 有 2 项、且**都无法在本轮修**：
        #     · vite（devDependency，仅构建期）：修复要 5.x → 8.x 的 major 升级，
        #       跨越 3 个大版本，属于独立改造任务，不能顺手塞进来；
        #     · xlsx（**生产依赖**）：SheetJS 已不在 npm 上发新版（fixAvailable: false），
        #       要么改用官方 CDN 源安装、要么整体换 exceljs —— 需要单独评估。
        #   门禁若定在 high，CI 会**立刻常红**，最后必然被人绕过或关掉
        #   （本仓库记忆里有明确一条：门禁一亮红就被 --no-verify 绕过）。
        #   所以先锁 critical（当前 0 ⇒ 绿），把 high 当**已知待办**跟踪，
        #   每修掉一个就把 --audit-level 收紧一档。
        working-directory: frontend
        run: npm audit --audit-level=critical
