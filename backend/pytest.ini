[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session
# 全部测试共用一个事件循环：asyncpg 连接池里的连接绑定在创建它的 loop 上，
# 若每个测试换 loop，复用旧连接会报 "attached to a different loop"。
asyncio_default_test_loop_scope = session
addopts = -q --tb=short -p no:cacheprovider
markers =
    allow_real_llm: 放行真实 LLM 出网（默认被 conftest._no_real_llm 阻断）
filterwarnings =
    ignore::DeprecationWarning
