[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session
# 全部测试共用一个事件循环：asyncpg 连接池里的连接绑定在创建它的 loop 上，
# 若每个测试换 loop，复用旧连接会报 "attached to a different loop"。
asyncio_default_test_loop_scope = session
addopts = -q --tb=short -p no:cacheprovider
# ★ 单条用例的墙钟上限（秒）：卡死从「无限等」变成「有限并给栈」。
#   第 243 轮实测：卡在收尾 15 min 无进展，只能人工 kill（且退出码不可信）。
#   Windows 无 SIGALRM ⇒ 必须用 thread 方案（超时即 dump 全部线程栈并终止进程）。
#   确有长耗时的用例用 @pytest.mark.timeout(N) 单独放宽（本仓 3 处已标注）。
timeout = 120
timeout_method = thread
markers =
    allow_real_llm: 放行真实 LLM 出网（默认被 conftest._no_real_llm 阻断）
    allow_real_network_subprocess: 放行真实网络子进程（默认被 conftest._no_real_network_subprocess 阻断）
    tenant_identity: 本模块的请求默认带「夹具租户」身份（见 conftest 同名说明）
filterwarnings =
    ignore::DeprecationWarning
