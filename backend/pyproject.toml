# ============================================================
#  后端工程配置（2026-09-15 新增）
# ------------------------------------------------------------
#  为什么要有这个文件：
#    此前后端**没有任何工程级配置** —— 没有 ruff/mypy 配置、没有项目元数据。
#    结果是「想加静态检查时无从下手」，而且 ruff 会在任意目录生成默认配置。
#
#  ★ 重要说明：本文件**不包含 [tool.pytest.ini_options]**。
#    测试配置在 `pytest.ini` 里。pytest 的配置优先级是
#      pytest.ini > pyproject.toml > tox.ini > setup.cfg
#    两处都写会造成「改了 pyproject 却不生效」的静默困惑，因此只保留 pytest.ini 一处。
#
#  ⚠️ 静态检查的接入状态（如实标注，避免「配置存在 ≠ 门禁在执行」）：
#    - ruff：**已部分接入 CI**（2026-09-17 第 132 轮）。
#      全量 `ruff check .` 基线 **2807 条**（UP045/UP006/I001 占大头，2385 条可自动修）——
#      一次性修完不现实，硬接 CI 只会被人 --no-verify 绕过、最后没人信。
#      所以 CI 只跑**已收敛到零的那部分**：`ruff check . --select T20`。
#      以后每收敛一类（如 F401 unused-import）就往 CI 的 --select 加一项，
#      形成**棘轮**：只增不减、永不回退。
#    - mypy：配置已就绪，**仍未接入 CI**（存量无标注，接入前同样要先跑基线）。
#    - 覆盖率 / bandit / pip-audit：见下方 [tool.coverage.*]、[tool.bandit]，
#      以及 .github/workflows/ci.yml 的 security job。
# ============================================================

[project]
name = "ecommerce-ai-saas-backend"
version = "0.1.0"
description = "店管家 AI —— 一站式 AI 原生跨境电商全链路 SaaS 后端"
requires-python = ">=3.11"
readme = "README.md"

# 依赖以 requirements.txt 为唯一真源。
# 不在这里重复声明 dependencies（两处声明必然漂移，
# 而运维和 CI 装的都是 requirements.txt —— 漂移时出问题的永远是"另一个文件"）。
dependencies = []

# ==================== Ruff（linter + formatter）====================

[tool.ruff]
target-version = "py311"
line-length = 120
# 排除：迁移脚本（自动生成）、本地数据、构建产物
exclude = [
    ".git",
    "__pycache__",
    ".pytest_cache",
    ".ruff_cache",
    "alembic/versions",
    "uploads",
    "logs",
    "scripts/generate_amazon_mock_data*.json",
]

[tool.ruff.lint]
# 选的规则集说明：
#   E/W  pycodestyle  —— 基础风格（缩进、空白）
#   F    pyflakes     —— 未使用导入/变量、未定义名（**性价比最高，先开这个**）
#   I    isort        —— 导入排序
#   B    bugbear      —— 常见陷阱（可变默认参数、except 里 raise 丢栈等）
#   UP   pyupgrade    —— 过时写法升级
#   ASYNC             —— async 用法错误（在 await 里做阻塞调用等）
#   S    bandit       —— 安全问题（硬编码密码、assert 用作校验等）
#   T20  flake8-print —— 生产代码里出现 print（只启 T20 子集，不含 T10/T30）
#       ★ 第 132 轮补：此前 select 里**没有 T**，而 per-file-ignores 却写着
#         `"scripts/**" = ["T201"]` —— 一条从未被启用的规则被"忽略"着，
#         是典型的**死配置**：配了、review 过、也永远不会触发。
#         启用 T20 后，生产代码里新增的 print 才真正成为一个能说"不"的门禁。
select = ["E", "W", "F", "I", "B", "UP", "ASYNC", "S", "T20"]

# 忽略项 + 忽略理由（不加理由的 ignore 会变成"永久性黑洞"）
ignore = [
    "E501",    # 行太长 —— line-length 已由 formatter 兜底，linter 不必重复报
    "B008",    # 函数默认值里调函数 —— FastAPI 的 Depends()/Query() 就靠这个写法
    "S101",    # 使用 assert —— 测试里大量使用；业务代码由 S 规则其他项覆盖
    "S104",    # 绑定 0.0.0.0 —— 容器里必须绑 0.0.0.0，不是问题
]

[tool.ruff.lint.per-file-ignores]
# 测试文件放宽：允许 assert、允许魔法值、允许私有成员访问
"tests/**" = ["S101", "S105", "S106", "SLF001"]
# ★ scripts/ 允许 print —— 这不是"偷懒豁免"，而是它们**本来就不该走 logger**：
#   scripts/ 的输出是**机器可读契约**（例如 check_multi_turn_memory.py 固定输出
#   `RESULT_JSON: {...}` 供 tests/test_agent_session_memory.py 解析；
#   pick_tests.py 输出文件清单供 CI 消费）。loguru 会给每行加时间戳/级别前缀，
#   直接破坏解析 —— CLI 工具的 stdout 就是它的接口，print 在此是正确工具。
"scripts/**" = ["T201"]
"modules/**/seed.py" = ["T201"]
# 该文件是「既是 pytest 用例、又是手工演示入口」的混合体（见文末 --main 块）：
#   46 处 print 集中在 print_separator()/main() 里，是为人工跑一遍看链路是否通
#   而写的可读输出，不是遗留的调试语句。
"tests/test_llm_rag_integration.py" = ["T201"]
# 迁移脚本自动生成，不参与风格检查
"alembic/**" = ["E", "W", "F", "I", "B", "UP", "S", "T20"]

[tool.ruff.lint.isort]
known-first-party = ["core", "modules", "platforms", "ai_infra", "models"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

# ==================== mypy（宽松档）====================

[tool.mypy]
python_version = "3.11"
# 不以「零错误」为目标启动 —— 先只抓「能确定是 bug」的类别
ignore_missing_imports = true
follow_imports = "silent"
# SQLAlchemy / pydantic 的插件化类型推断在这里收益有限、噪声很大，先不开
plugins = []
# 不要对全部函数强制标注（存量代码没有标注，开了就是几千条）
disallow_untyped_defs = false
disallow_incomplete_defs = false
# 但这些「能真抓 bug」的检查打开：
warn_redundant_casts = true
warn_unused_ignores = false   # 存量有大量 # type: ignore，开启会刷屏
warn_return_any = false
no_implicit_optional = true   # 默认值 None 必须标 Optional —— 真能抓 bug
strict_equality = true        # 不同类型比较给出警告 —— 抓过 ||/&& 写错
show_error_codes = true
exclude = [
    "alembic/versions",
    "uploads",
    "logs",
]

# ==================== 覆盖率（coverage.py / pytest-cov）====================
#
# ★ 为什么要显式写 source，而不是用默认的"已导入模块"统计：
#   默认口径的分母取决于"测试恰好 import 了什么"，导致
#   ① 覆盖率会随无关改动漂移（多 import 一个模块就掉几个点）；
#   ② 没被任何测试碰过的模块**根本不进分母** —— 最该被看见的裸奔代码反而消失。
#   source 显式列出业务代码，分母固定，数字才有可比性。

[tool.coverage.run]
# ★ 这里**刻意不写 `source`** —— 这是第 132 轮本地实测踩出来的坑，务必保留说明：
#   coverage 处理**配置里的** `source` 时会 `importlib.import_module(name)` 去定位包路径。
#   一旦把 `main` / `main.py` 列进去，`import main` 就会**执行 main.py 的顶层代码**：
#   建 FastAPI app、注册全部路由、import 全部业务模块 ⇒ SQLAlchemy 的
#   Base.metadata 里同名表被注册两次
#   （实测症状：`InvalidRequestError: Table 'accounts' already defined` +
#    `KeyError: 'test_stores'`，6 个测试文件在 **collection 阶段**直接 ERROR，
#    完全看不出跟覆盖率有关，极易被误判成"代码坏了"）。
#   而 pytest-cov 的 `--cov=main` 走的是**路径**处理、不会 import ⇒ 两者行为不同。
#   ⇒ 所以：**覆盖率目标由命令行 `--cov=core --cov=modules ...` 显式指定**
#     （见 .github/workflows/ci.yml 的「跑测试」步骤）；本段只定义"怎么算"。
# 分支覆盖：只统计"语句执行过"会漏掉 if/else 只走一边的情况
branch = true
omit = [
    "*/tests/*",
    "*/alembic/versions/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
# ★ fail_under 是**棘轮**，不是"目标值"：它锁住"不许比现在更差"，
#   而不是要求立刻达到某个理想数字。
#
#   ⚠️ 口径提醒：本项目这个数字是 **line + branch 综合**（[tool.coverage.run] 开了
#   branch = true），因此比"只看语句覆盖率"低几个点 —— 同一份代码
#   line-only 是 66.94%、综合是 62.53%，**两个数字都真实**。
#   横向比较前必须先确认口径，否则会误判成"覆盖率掉了"。
#   基线 62.53%（2026-09-17 实测，954 passed / 0 failed，
#   见 .workbuddy/probes/out-r132-g3-full.txt），这里取 62，
#   留 ~0.5pp 波动余量（重构时增删行数不该让 CI 随机红）。
#   要提高覆盖率 → 先补测试、实测新基线、再抬这个数字，**顺序不能反**。
#   ★ 本轮就犯过一次这个错：先按 line-only 的 65.95% 定了 fail_under=65，
#     随后启用 branch = true，真实值变成 62.53% ⇒ CI 直接红。
#     教训：**改覆盖口径的同一次改动里，必须重算阈值**。
fail_under = 62
show_missing = true
skip_covered = true      # 只列未 100% 的文件，否则输出几千行没人看
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "@(abc\\.)?abstractmethod",
    "\\.\\.\\.",
]

[tool.coverage.json]
output = "coverage.json"

[tool.coverage.xml]
output = "coverage.xml"


# ==================== bandit（专项安全扫描）====================
#
# ★ 已经有了 ruff 的 S 规则，为什么还要单独跑 bandit：
#   ruff 的 S 是 **bandit 规则的移植子集**（常见几十条），
#   bandit 本体有 200+ 条（B1xx~B6xx）并支持 `# nosec` 精确豁免 + 严重度分级。
#   两者不重复劳动：ruff 管"顺手能修的安全写法"，bandit 管"专项深扫 + 出报告"。

[tool.bandit]
targets = ["core", "modules", "platforms", "ai_infra", "main.py", "worker.py"]
# 测试里的 assert/假密钥、迁移脚本的 SQL 拼接、CLI 脚本的 subprocess 都不是线上风险
exclude_dirs = ["tests", "alembic", "scripts", "uploads", "logs"]
# 显式豁免（每条必须写理由，否则就成了"永久黑洞"）：
#   B104 绑定 0.0.0.0 —— 容器内必须绑 0.0.0.0，否则宿主机/Nginx 访问不到；
#        对外暴露由安全组与 Nginx 控制。与 ruff 侧 ignore S104 是同一个判断。
skips = ["B104"]


# ==================== 接入静态检查的操作步骤 ====================
#
# 1) 装依赖：
#      pip install ruff mypy
#
# 2) 先生成基线（看看到底有多少问题，不要直接修）：
#      cd backend
#      ruff check . --statistics
#      ruff check . --select F --output-format=concise   # 先只修 F（未使用/未定义）
#
# 3) 按「风险从高到低」分批修：F → B → ASYNC → S → E/W → UP
#    F 类里 `F821 undefined name` 和 `F401 unused import` 是真 bug 或死代码，
#    而 `F841 unused variable` 经常是"忘写后续逻辑"的信号 —— 都值得逐个看。
#
# 4) 修完再在 .github/workflows/ci.yml 的 backend job 里加一步：
#      - name: Ruff
#        run: ruff check . && ruff format --check .
#
# ★ 顺序不能反：先上 CI、再修问题 = 门禁一亮红就被人 --no-verify 绕过，
#   最后变成「有 CI 但没人信」。必须先让基线干净，再把它设成门禁。
